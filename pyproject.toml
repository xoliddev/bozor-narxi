[project]
name = "bozor-narxi"
version = "1.0.0"
description = "Bazaar prices for Tashkent: people send prices through a Telegram bot, a robust weighted median with outlier filtering and reporter reputation decides the shown price, and a public website, a Mini App and the bot answer \"qayerda arzon?\""
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "S603"]
"scripts/*" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
